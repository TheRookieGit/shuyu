# Publishes only the static pages in web/ and lite/; book data stays on the Windows backend.
name: Deploy web page

on:
  push:
    branches: [main]
    paths: ['web/**', 'lite/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The full page at the site root, Shuyu Lite under /lite/.
      - run: mkdir _site && cp -r web/. _site/ && cp -r lite _site/lite
      # Versioned asset URLs, so a browser never pairs new scripts with a cached old stylesheet.
      - run: sed -i "s/?v=dev/?v=${GITHUB_SHA::12}/g" _site/index.html _site/lite/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
