# Builds 爱妻的书屿.exe on Windows and publishes it as the "app-latest" release.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['*.py', 'web/**', 'assets/**', 'requirements-app.txt', '.github/workflows/windows-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-app.txt
      - name: Run tests
        run: python -m unittest discover -s tests -t .
      - name: Build
        run: >
          pyinstaller --noconfirm --clean --windowed --name AiqiShuyu
          --icon assets/shuyu.ico --add-data "web;web" --add-data "assets/shuyu.ico;assets"
          desktop_app.py
      - name: Smoke test the packaged service
        shell: pwsh
        run: |
          $books = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\books"
          Set-Content -Encoding utf8 "$books\《测试》作者：某人.txt" "第一章 测试"
          $app = Start-Process dist\AiqiShuyu\AiqiShuyu.exe -PassThru -ArgumentList '--no-window','--port','8790','--root',"$books",'--data-dir',"$env:RUNNER_TEMP\data"
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 1
            try {
              $stats = Invoke-RestMethod http://127.0.0.1:8790/api/stats
              if ($stats.total -ge 1) { $ok = $true; break }
            } catch {}
          }
          Stop-Process $app -Force
          if (-not $ok) { throw 'Packaged app did not serve the test library' }
      - name: Package
        shell: pwsh
        run: |
          Rename-Item dist\AiqiShuyu 爱妻的书屿
          Rename-Item dist\爱妻的书屿\AiqiShuyu.exe 爱妻的书屿.exe
          Compress-Archive -Path dist\爱妻的书屿 -DestinationPath AiqiShuyu-windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete app-latest --yes --cleanup-tag 2>$null
          gh release create app-latest AiqiShuyu-windows.zip --target $env:GITHUB_SHA --title "爱妻的书屿 Windows 版（最新）" --notes "解压后双击「爱妻的书屿.exe」。构建自 $env:GITHUB_SHA。"
